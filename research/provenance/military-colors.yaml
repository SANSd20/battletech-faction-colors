schema_version: 1
subject: military_color_provenance
notes:
- This file records source observations separately from canonical Military claims and reusable UI palettes.
- Shrapnel observations were verified against the supplied Box PDFs. Camo Specs observations retain their immediate URL and distinguish reported underlying citations from independently inspected publications.
- Exact hexadecimal values remain UI_ADAPTATION choices, not official source specifications.
observations:
- id: shrapnel-01-smoke-jaguar-gray-uniform
  faction_id: clan-smoke-jaguar
  source_type: primary_periodical
  source_name: Shrapnel
  issue: 01
  page: 33
  subject: Star Colonel Paul Moon
  observed_colors: [gray]
  scope: CHARACTER_SPECIFIC / UNIFORM
  evidence_classification: REPRESENTATIVE_DERIVED
  observation: Star Colonel Paul Moon is described wearing a pristine gray uniform.
  limitation: Individual uniform evidence does not override documented formation variation.
  relationship_to_military_claim: additional_observation_no_status_change
- id: shrapnel-02-snow-raven-ceremonial-white
